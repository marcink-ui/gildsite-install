# Design (Doop) for __NAME__, generated by gildsite-install; do not edit by hand.
# Its own database and its own random secrets (in .env next to this file, readable only by root; never in this file).
# Joined to the instance network with the alias "design": the panel reaches it at http://design:4400, Caddy too.
# The port on 127.0.0.1 is only for the installer's check and for an existing nginx; it is not open to the internet.
name: __NAME__-design
services:
  app:
    image: __IMAGE__
    ports: ["127.0.0.1:__PORT__:4400"]
    environment:
      DATABASE_URL: postgres://doop:${PG_HASLO}@db:5432/doop
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # Nobody can sign up from outside: no e-mail address ends in .invalid.
      SIGNUP_EMAIL_DOMAINS: brak.invalid
      GILDWEAVE_KLUCZ: ${GILDWEAVE_KLUCZ}
      DEFAULT_LOCALE: en
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1500m
    cpus: 1.5
    networks:
      default: {}
      instancja:
        aliases: [design]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doop
      POSTGRES_PASSWORD: ${PG_HASLO}
      POSTGRES_DB: doop
    volumes:
      - dane-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doop"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
volumes:
  dane-pg: {}
networks:
  instancja:
    name: __NAME__-net
    external: true
