# Gildsite web server (Caddy), generated by gildsite-install. Joins the instance network with a fixed address,
# which the panel trusts for the visitor's IP (ZAUFANE_PROXY). Certificates are kept in the volume "caddy-dane".
name: __NAME__-www
services:
  caddy:
    image: caddy:2.10
    container_name: __NAME__-www
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dane:/data
      - caddy-ustawienia:/config
    networks:
      instancja:
        ipv4_address: __IP__
    mem_limit: 256m
    restart: unless-stopped
volumes:
  caddy-dane: {}
  caddy-ustawienia: {}
networks:
  instancja:
    name: __NAME__-net
    external: true
